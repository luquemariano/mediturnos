server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~* ^/(?:login|registro|forgot-password|reset-password|app(?:/.*)?|admin(?:/.*)?|onboarding(?:/.*)?|suscripcion/retorno|estudios/enviar|baja-novedades)/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri @private_spa;
    }

    location @private_spa {
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^ /index.html break;
    }

    location / {
        try_files $uri/index.html $uri /index.html;
    }
}
