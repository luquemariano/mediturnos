name: turnelia-staging

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:?STAGING_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Generate an exclusive staging secret}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:?STAGING_POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - staging_backups:/var/backups/staging
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      com.turnelia.environment: staging

  api:
    image: turnelia-staging-api:${STAGING_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:?Set STAGING_ENV_FILE to an external, private staging config}
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://${STAGING_POSTGRES_USER}:${STAGING_POSTGRES_PASSWORD}@db:5432/${STAGING_POSTGRES_DB}
      APP_TIMEZONE: America/Argentina/Buenos_Aires
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://127.0.0.1:18081}
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["http://127.0.0.1:18080"]}'
      MERCADOPAGO_ENV: sandbox
      WHATSAPP_ENABLED: ${STAGING_WHATSAPP_META_ENABLED:-false}
      WHATSAPP_PROVIDER: ${STAGING_WHATSAPP_PROVIDER:-fake}
      STAGING_WHATSAPP_META_ENABLED: ${STAGING_WHATSAPP_META_ENABLED:-false}
      STAGING_WHATSAPP_META_TEST_NUMBER_CONFIRMED: ${STAGING_WHATSAPP_META_TEST_NUMBER_CONFIRMED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-in_memory}
      OBJECT_STORAGE_PROVIDER: fake
      BOOTSTRAP_ADMIN_EMAIL: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""
      DEMO_SEED_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - ingress
    ports:
      - "127.0.0.1:${STAGING_API_PORT:-18081}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      com.turnelia.environment: staging

  frontend:
    image: turnelia-staging-frontend:${STAGING_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.vps
      args:
        VITE_API_URL: ${STAGING_BROWSER_API_URL:-http://127.0.0.1:18081}
        VITE_MERCADOPAGO_PUBLIC_KEY: ""
        VITE_POSTHOG_PROJECT_TOKEN: ""
        VITE_POSTHOG_HOST: ""
        VITE_ANALYTICS_ENABLED: "false"
    restart: unless-stopped
    networks:
      - ingress
    ports:
      - "127.0.0.1:${STAGING_FRONTEND_PORT:-18080}:80"
    volumes:
      - ./frontend/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      com.turnelia.environment: staging

volumes:
  postgres_data:
    name: turnelia-staging-postgres
  staging_backups:
    name: turnelia-staging-backups

networks:
  backend:
    name: turnelia-staging-backend
    internal: true
  ingress:
    name: turnelia-staging-ingress
