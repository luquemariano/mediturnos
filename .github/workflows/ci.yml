name: Turnelia CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET_KEY: turnelia-ci-only-synthetic-jwt-key-2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest

  postgresql-ci:
    name: PostgreSQL CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: turnelia_ci
          POSTGRES_PASSWORD: turnelia-ci-only-postgres-password-2026
          POSTGRES_DB: turnelia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnelia_ci -d turnelia_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      TEST_DATABASE_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      TEST_POSTGRES_CONCURRENCY_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      TEST_POSTGRES_REMINDERS_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      TEST_POSTGRES_APPOINTMENT_ACTIONS_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      JWT_SECRET_KEY: turnelia-ci-only-synthetic-jwt-key-2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Inspect Alembic heads
        run: alembic heads

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Confirm Alembic revision
        run: alembic current

      - name: Verify PostgreSQL exclusion constraint
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import settings

          engine = create_engine(settings.database_url)
          query = text("""
              SELECT 1
              FROM pg_constraint
              WHERE conname = 'ex_turnos_profesional_intervalo_activo'
          """)
          with engine.connect() as connection:
              if connection.execute(query).scalar_one_or_none() != 1:
                  raise SystemExit(
                      "PostgreSQL exclusion constraint is missing"
                  )
          print("[OK] PostgreSQL exclusion constraint verified.")
          PY

      - name: Run PostgreSQL tests
        run: |
          set +e
          python -m pytest \
            tests/test_concurrencia_turnos_postgresql.py \
            tests/test_appointment_reminders_postgresql.py \
            tests/test_appointment_actions_postgresql.py \
            -ra --junitxml=postgresql-test-results.xml
          pytest_status=$?
          set -e
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          required = {
              "tests/test_concurrencia_turnos_postgresql.py",
              "tests/test_appointment_reminders_postgresql.py",
              "tests/test_appointment_actions_postgresql.py",
          }
          root = ET.parse("postgresql-test-results.xml").getroot()
          observed = set()
          for testcase in root.iter("testcase"):
              identity = " ".join(
                  testcase.attrib.get(attribute, "")
                  for attribute in ("file", "classname", "name")
              )
              for module in required:
                  module_stem = module.removesuffix(".py").replace("/", ".")
                  if module_stem in identity and not testcase.find("skipped"):
                      observed.add(module)
          missing = sorted(required - observed)
          if missing:
              print("[FAIL] PostgreSQL modules without executed tests:")
              for filename in missing:
                  print(f"- {filename}")
              sys.exit(1)
          print("[OK] All mandatory PostgreSQL modules executed at least one test.")
          PY
          verification_status=$?
          if [ "$pytest_status" -ne 0 ] || [ "$verification_status" -ne 0 ]; then
            exit 1
          fi

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run tests

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  playwright-e2e-ci:
    name: Playwright E2E CI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_DB_PASSWORD: turnelia-ci-only-e2e-db-password-2026
      DATABASE_URL: postgresql+psycopg://turnelia_e2e:turnelia-ci-only-e2e-db-password-2026@127.0.0.1:55432/turnelia_e2e
      E2E_JWT_SECRET: turnelia-ci-only-e2e-jwt-secret-2026
      JWT_SECRET_KEY: turnelia-ci-only-e2e-jwt-secret-2026
      APP_ENV: test
      E2E_DATABASE_NAME: turnelia_e2e
      E2E_ADMIN_PASSWORD: turnelia-ci-only-e2e-admin-password-2026
      VITE_API_URL: http://127.0.0.1:8001
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:5174"]'
      FRONTEND_URL: http://127.0.0.1:5174
      EMAIL_PROVIDER: in_memory
      OBJECT_STORAGE_PROVIDER: fake
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start E2E PostgreSQL
        run: |
          docker compose -p turnelia-e2e -f docker-compose.e2e.yml up -d db
          deadline=$((SECONDS + 60))
          until docker compose -p turnelia-e2e -f docker-compose.e2e.yml exec -T db pg_isready -U turnelia_e2e -d turnelia_e2e >/dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "PostgreSQL E2E readiness timeout" >&2
              exit 1
            fi
            sleep 1
          done
          echo "[OK] PostgreSQL E2E ready."

      - name: Run E2E migrations
        run: python -m alembic upgrade head

      - name: Seed E2E database
        run: python -m app.scripts.seed_e2e

      - name: Start API and wait for readiness
        run: |
          setsid python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > artifacts/api.log 2>&1 &
          echo $! > artifacts/api.pid
          deadline=$((SECONDS + 60))
          until curl --fail --silent --show-error http://127.0.0.1:8001/health/ready >/dev/null; do
            if ! kill -0 "$(cat artifacts/api.pid)" 2>/dev/null; then
              echo "API exited before readiness" >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "API readiness timeout" >&2
              exit 1
            fi
            sleep 1
          done
          echo "[OK] API E2E ready."

      - name: Start frontend and wait for readiness
        working-directory: frontend
        run: |
          setsid npm run dev -- --host 127.0.0.1 --port 5174 > ../artifacts/frontend.log 2>&1 &
          echo $! > ../artifacts/frontend.pid
          deadline=$((SECONDS + 60))
          until curl --fail --silent --show-error http://127.0.0.1:5174 >/dev/null; do
            if ! kill -0 "$(cat ../artifacts/frontend.pid)" 2>/dev/null; then
              echo "Frontend exited before readiness" >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Frontend readiness timeout" >&2
              exit 1
            fi
            sleep 1
          done
          echo "[OK] Frontend E2E ready."

      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test e2e/smoke.spec.ts e2e/auth.spec.ts e2e/admin.spec.ts

      - name: Capture and sanitize E2E logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -p turnelia-e2e -f docker-compose.e2e.yml logs db > artifacts/postgres.log 2>&1 || true
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          files = [Path("artifacts/api.log"), Path("artifacts/frontend.log"), Path("artifacts/postgres.log")]
          values = [
              os.environ.get("E2E_DB_PASSWORD", ""),
              os.environ.get("DATABASE_URL", ""),
              os.environ.get("E2E_JWT_SECRET", ""),
              os.environ.get("JWT_SECRET_KEY", ""),
              os.environ.get("E2E_ADMIN_PASSWORD", ""),
          ]
          patterns = [re.escape(value) for value in values if value]
          patterns += [
              r"postgres(?:ql)?(?:\+psycopg)?://[^\s\"'<>]+",
              r"(?i:authorization:\s*bearer\s+[^\s]+)",
              r"(?i:(?:password|secret|token|jwt)\s*[:=]\s*[^\s]+)",
          ]
          sanitizer = re.compile("|".join(patterns))
          for path in files:
              if not path.exists():
                  continue
              try:
                  content = path.read_text(errors="replace")
                  path.write_text(sanitizer.sub("[REDACTED]", content))
              except Exception:
                  path.unlink(missing_ok=True)
          PY

      - name: Stop E2E processes
        if: always()
        run: |
          stop_group() {
            pid_file="$1"
            if [ ! -f "$pid_file" ]; then return; fi
            pid=$(cat "$pid_file")
            if ! kill -0 "$pid" 2>/dev/null; then return; fi
            sid=$(ps -o sid= -p "$pid" | tr -d ' ')
            if [ -n "$sid" ]; then kill -- "-$sid" 2>/dev/null || true; fi
            kill "$pid" 2>/dev/null || true
          }
          stop_group artifacts/frontend.pid
          stop_group artifacts/api.pid

      - name: Cleanup E2E resources
        if: always()
        run: |
          docker compose -p turnelia-e2e -f docker-compose.e2e.yml down -v --remove-orphans
          rm -f artifacts/api.pid artifacts/frontend.pid

      - name: Upload sanitized E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-logs
          path: |
            artifacts/api.log
            artifacts/frontend.log
            artifacts/postgres.log
          if-no-files-found: ignore
          retention-days: 7
