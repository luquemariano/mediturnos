name: Turnelia CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET_KEY: turnelia-ci-only-synthetic-jwt-key-2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest

  postgresql-ci:
    name: PostgreSQL CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: turnelia_ci
          POSTGRES_PASSWORD: turnelia-ci-only-postgres-password-2026
          POSTGRES_DB: turnelia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnelia_ci -d turnelia_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      TEST_DATABASE_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      TEST_POSTGRES_CONCURRENCY_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      TEST_POSTGRES_REMINDERS_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      TEST_POSTGRES_APPOINTMENT_ACTIONS_URL: postgresql+psycopg://turnelia_ci:turnelia-ci-only-postgres-password-2026@localhost:5432/turnelia_ci
      JWT_SECRET_KEY: turnelia-ci-only-synthetic-jwt-key-2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Inspect Alembic heads
        run: alembic heads

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Confirm Alembic revision
        run: alembic current

      - name: Verify PostgreSQL exclusion constraint
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import settings

          engine = create_engine(settings.database_url)
          query = text("""
              SELECT 1
              FROM pg_constraint
              WHERE conname = 'ex_turnos_profesional_intervalo_activo'
          """)
          with engine.connect() as connection:
              if connection.execute(query).scalar_one_or_none() != 1:
                  raise SystemExit(
                      "PostgreSQL exclusion constraint is missing"
                  )
          print("[OK] PostgreSQL exclusion constraint verified.")
          PY

      - name: Run PostgreSQL tests
        run: |
          set +e
          python -m pytest \
            tests/test_concurrencia_turnos_postgresql.py \
            tests/test_appointment_reminders_postgresql.py \
            tests/test_appointment_actions_postgresql.py \
            -ra --junitxml=postgresql-test-results.xml
          pytest_status=$?
          set -e
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          required = {
              "tests/test_concurrencia_turnos_postgresql.py",
              "tests/test_appointment_reminders_postgresql.py",
              "tests/test_appointment_actions_postgresql.py",
          }
          root = ET.parse("postgresql-test-results.xml").getroot()
          observed = set()
          for testcase in root.iter("testcase"):
              identity = " ".join(
                  testcase.attrib.get(attribute, "")
                  for attribute in ("file", "classname", "name")
              )
              for module in required:
                  module_stem = module.removesuffix(".py").replace("/", ".")
                  if module_stem in identity and not testcase.find("skipped"):
                      observed.add(module)
          missing = sorted(required - observed)
          if missing:
              print("[FAIL] PostgreSQL modules without executed tests:")
              for filename in missing:
                  print(f"- {filename}")
              sys.exit(1)
          print("[OK] All mandatory PostgreSQL modules executed at least one test.")
          PY
          verification_status=$?
          if [ "$pytest_status" -ne 0 ] || [ "$verification_status" -ne 0 ]; then
            exit 1
          fi

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run tests

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
