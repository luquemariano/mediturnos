services:
  db:
    image: postgres:17-alpine
    container_name: mediturnos-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .

    container_name: mediturnos-api

    depends_on:
      db:
        condition: service_healthy

    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_ENV: ${MERCADOPAGO_ENV:-sandbox}
      MERCADOPAGO_TEST_PAYER_EMAIL: ${MERCADOPAGO_TEST_PAYER_EMAIL:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-60}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-in_memory}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PORT: ${PORT:-8000}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_ADMIN_RESET_PASSWORD: ${DEMO_ADMIN_RESET_PASSWORD:-false}
      DEMO_PROFESSIONAL_EMAIL: ${DEMO_PROFESSIONAL_EMAIL:-}
      DEMO_PROFESSIONAL_PASSWORD: ${DEMO_PROFESSIONAL_PASSWORD:-}
      DEMO_PROFESSIONAL_RESET_PASSWORD: ${DEMO_PROFESSIONAL_RESET_PASSWORD:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_REGISTER_ATTEMPTS: ${RATE_LIMIT_REGISTER_ATTEMPTS:-5}
      RATE_LIMIT_LOGIN_ATTEMPTS: ${RATE_LIMIT_LOGIN_ATTEMPTS:-15}
      RATE_LIMIT_PASSWORD_RESET_ATTEMPTS: ${RATE_LIMIT_PASSWORD_RESET_ATTEMPTS:-3}

    ports:
      - "${PORT:-8000}:${PORT:-8000}"
volumes:
  postgres_data:
